<title>Simulador Power BI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: banco de trabajo de escritorio. Barra oscura arriba, cinta de herramientas clara, lienzo gris con objetos visuales blancos y dos paneles laterales. */
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1b1a; --surface: #262423; --surface2: #302e2c; --canvas: #151413; --line: #403d3a;
    --fg: #f0eeeb; --muted: #b6b2ac; --faint: #8f8b85;
    --bar: #100f0e; --bar-fg: #f3f1ee; --bar-muted: #a9a59f;
    --accent: #f2c811; --accent-ink: #1b1a14; --link: #74b8f2;
    --ok: #62cf84; --bad: #ff8c82; --warn: #f0b95a;
    --c1: #5aa9e6; --c2: #f2a266; --c3: #4cc4b5; --c4: #b394e0;
    --ok-bg: #1d3626; --bad-bg: #402220; --sel: #3a3318;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1b1a; --surface: #262423; --surface2: #302e2c; --canvas: #151413; --line: #403d3a;
  --fg: #f0eeeb; --muted: #b6b2ac; --faint: #8f8b85;
  --bar: #100f0e; --bar-fg: #f3f1ee; --bar-muted: #a9a59f;
  --accent: #f2c811; --accent-ink: #1b1a14; --link: #74b8f2;
  --ok: #62cf84; --bad: #ff8c82; --warn: #f0b95a;
  --c1: #5aa9e6; --c2: #f2a266; --c3: #4cc4b5; --c4: #b394e0;
  --ok-bg: #1d3626; --bad-bg: #402220; --sel: #3a3318;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; line-height: 1.4; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.topbar { background: var(--bar); color: var(--bar-fg); display: flex; align-items: center; gap: 12px; padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 18px; background: var(--accent); display: inline-block; clip-path: polygon(0 40%, 35% 40%, 35% 0, 100% 0, 100% 100%, 0 100%); }
.topbar .sub { color: var(--bar-muted); font-size: 12px; }

.topbar button:hover { background: #3a3733; }

.ribbon { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 4px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; align-items: stretch; }
.rgroup { display: flex; gap: 2px; padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--line); align-items: stretch; }
.rgroup:last-child { border-right: 0; }

.pending { background: var(--sel); border-bottom: 1px solid var(--line); padding: 5px 16px; font-size: 12px; color: var(--warn); }
.fbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 6px; }

.fbar .ferr { color: var(--bad); } .fbar .fok { color: var(--ok); }

.workspace { flex: 1; min-height: 0; display: flex; }
.rail { width: 52px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 6px 0; gap: 2px; flex: none; }

.rail button svg { width: 22px; height: 22px; }
.rail button.on { border-left-color: var(--accent); color: var(--fg); background: var(--surface2); }
.rail button:hover { background: var(--surface2); }
.stage { flex: 1; min-width: 0; overflow: auto; background: var(--canvas); padding: 14px; }

.pane:last-child { border-right: 0; }
.pane h3 { margin: 0; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pane h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; }

.vtype:hover { border-color: var(--accent); background: var(--sel); }
.vtype svg { width: 20px; height: 20px; }
.well { border: 1px dashed var(--line); border-radius: 3px; padding: 5px; min-height: 34px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
.well.over { border-color: var(--accent); background: var(--sel); }
.well .wl { font-size: 11px; color: var(--muted); }
.chip { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px 2px 6px; min-width: 0; }
.chip .cn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip select { max-width: 92px; font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; }
.chip .x, .ibtn { background: transparent; border: 0; color: var(--muted); padding: 0 4px; line-height: 1; font-size: 15px; }
.chip .x:hover, .ibtn:hover { color: var(--bad); }
.tname { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; padding: 3px 0; user-select: none; }
.tname .tw { width: 10px; color: var(--muted); }
.fld { display: flex; align-items: center; gap: 6px; padding: 2px 2px 2px 14px; border-radius: 3px; cursor: grab; min-width: 0; }
.fld:hover { background: var(--surface2); }

.badge.m { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.canvas { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: start; }
.vis { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; min-width: 0; grid-column: span 2; display: flex; flex-direction: column; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.vis.sel { outline: 2px solid var(--accent); outline-offset: 0; }
.vis.t-bar, .vis.t-col, .vis.t-line, .vis.t-table { grid-column: span 3; }
.vis.t-kpi { grid-column: span 2; }
.vis header { display: flex; align-items: center; gap: 6px; padding: 6px 8px 0; min-height: 26px; }
.vis .vt { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vis .vbody { padding: 6px 10px 10px; min-width: 0; overflow: auto; max-height: 330px; }
.vis .verr { color: var(--bad); font-size: 12px; background: var(--bad-bg); padding: 6px 8px; border-radius: 3px; }
.vis .vempty { color: var(--faint); font-size: 12px; padding: 14px 0; text-align: center; }
.cardv { font-size: 34px; font-weight: 500; letter-spacing: -.01em; padding: 6px 0 0; font-variant-numeric: tabular-nums; }
.kpiv .big { font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpiv .line2 { font-size: 12px; color: var(--muted); }
.kpiv .good { color: var(--ok); } .kpiv .badc { color: var(--bad); }
.kpiv .note { font-size: 11px; color: var(--faint); margin-top: 4px; }
.kpiv svg { width: 100%; height: 44px; display: block; margin-top: 4px; }
.brow { display: grid; grid-template-columns: minmax(60px, 28%) 1fr auto; gap: 8px; align-items: center; padding: 2px 3px; border-radius: 3px; cursor: pointer; }
.brow:hover, .brow.on { background: var(--sel); }

.brow .btrack { display: grid; gap: 2px; }
.brow .btrack i { display: block; height: 10px; border-radius: 1px; min-width: 1px; }
.s0 { background: var(--c1); } .s1 { background: var(--c2); } .s2 { background: var(--c3); } .s3 { background: var(--c4); }
.brow .bval { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 38px; text-align: right; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 1px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 9px; font-family: var(--sans); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .hit { cursor: pointer; }
.chart .hit:hover rect { opacity: .8; }
.chart .dim { opacity: .35; }
.tbl { border-collapse: collapse; width: 100%; font-size: 12px; }
.tbl th { text-align: left; font-weight: 600; border-bottom: 1px solid var(--line); padding: 3px 8px 3px 0; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
.tbl td { padding: 2px 8px 2px 0; border-bottom: 1px solid var(--surface2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl td.n, .tbl th.n { text-align: right; }
.slc label { display: flex; gap: 6px; align-items: center; padding: 2px 0; cursor: pointer; }
.empty { max-width: 560px; margin: 8vh auto; background: var(--surface); border: 1px solid var(--line); padding: 22px 24px; border-radius: 3px; display: grid; gap: 10px; }
.empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
.empty p { margin: 0; color: var(--muted); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.grid-wrap { background: var(--surface); border: 1px solid var(--line); overflow: auto; max-height: 100%; }
.dgrid { border-collapse: collapse; font-size: 12px; }
.dgrid th { position: sticky; top: 0; background: var(--surface2); text-align: left; padding: 4px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; font-weight: 600; }
.dgrid th.on { background: var(--sel); box-shadow: inset 0 -2px 0 var(--accent); }
.dgrid th small { display: block; color: var(--muted); font-weight: 400; font-size: 10px; }
.dgrid td { padding: 2px 10px; border-right: 1px solid var(--surface2); border-bottom: 1px solid var(--surface2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dgrid td.e { color: var(--faint); }
.dgrid td.n { text-align: right; }
.dgrid td.calc { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.pqwrap { display: grid; grid-template-columns: 150px minmax(0, 1fr) 220px; gap: 0; height: 100%; min-height: 0; background: var(--surface); border: 1px solid var(--line); }
.pqwrap > div { min-height: 0; overflow: auto; padding: 8px; }
.pqwrap .pqq { border-right: 1px solid var(--line); background: var(--bg); }
.pqwrap .pqs { border-left: 1px solid var(--line); background: var(--bg); }
.pqq button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 5px 6px; border-radius: 3px; }

.step { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 3px; border: 1px solid transparent; }
.step.base { color: var(--muted); }

.step .sn { flex: 1; min-width: 0; font-size: 12px; }
.step .sn small { display: block; color: var(--muted); }

.modelwrap { position: relative; display: flex; gap: 70px; align-items: flex-start; flex-wrap: wrap; padding: 6px 6px 18px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; min-width: 190px; max-width: 260px; z-index: 1; }
.mcard h4 { margin: 0; padding: 6px 10px; background: var(--bar); color: var(--bar-fg); font-size: 12.5px; border-radius: 3px 3px 0 0; }
.mcard .mc { display: flex; gap: 6px; align-items: center; padding: 3px 10px; cursor: pointer; border-bottom: 1px solid var(--surface2); }
.mcard .mc:hover { background: var(--surface2); }
.mcard .mc.pick { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.mcard .mc.over { background: var(--sel); }
.mcard .mc span.n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mlines { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
.mlines path { fill: none; stroke: var(--link); stroke-width: 1.6; }
.mlines text { fill: var(--link); font-size: 12px; font-weight: 600; }
.rels h4 { margin: 0; }

.rels .r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; width: min(380px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.18); z-index: 30; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer .dh { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }

.prog { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ok); }
.task { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 3px; }
.task.done { background: var(--ok-bg); border-color: transparent; }

.task.done .tk { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.task .tt { font-size: 13px; }
.task .th { font-size: 12px; color: var(--muted); margin-top: 4px; background: var(--bg); border-radius: 3px; padding: 5px 7px; font-family: var(--mono); white-space: pre-wrap; }
.linkbtn { background: none; border: 0; color: var(--link); padding: 0; text-decoration: underline; font-size: 12px; }

.dlg h2 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--line); }
.dlg .dbody { padding: 14px 16px; display: grid; gap: 10px; }

.dlg label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.dlg input[type=text] { padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; color: var(--fg); }
.dlg .src { border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }

.dlg .src label { display: flex; gap: 6px; padding: 2px 0; cursor: pointer; }

.foot { background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; padding: 5px max(16px, env(safe-area-inset-right, 0px)) 5px max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

<div id="app">
  <div class="topbar">
    <div class="brand"><i></i>Simulador Power BI</div>
    <div class="sub">Práctica de Power Query, modelo de datos y DAX</div>
    <div class="grow"></div>
    <button class="primary" id="exBtn" type="button">Ejercicio</button>

  <div class="ribbon" id="ribbon"></div>
  <div class="pending" id="pending" hidden></div>

      <div style="display:grid;gap:6px"><button class="btn primary" id="fbOk" type="button">Aceptar (Enter)</button><button class="btn" id="fbCancel" type="button">Cancelar</button></div>
    </div>
    <div class="fmsg" id="fmsg"></div>

    let l2 = '';
    if (tg) {
      if (typeof val === 'number' && typeof tv === 'number' && tv !== 0) {
        const pct = (val - tv) / Math.abs(tv) * 100, good = val >= tv;
        l2 = `Objetivo: ${esc(fmtVal(tv, fieldFmt(tg)))} <span class="${good ? 'good' : 'badc'}">(${pct >= 0 ? '+' : ''}${pct.toLocaleString('es-AR', { maximumFractionDigits: 1 })} %)</span>`;
      } else l2 = `Objetivo: ${esc(fmtVal(tv, fieldFmt(tg)))}`;
    }
    return `<div class="kpiv"><div class="big">${esc(fmtVal(val, fieldFmt(f)))}</div><div class="line2">${l2}</div>${spark}${note}</div>`;
  }
  if (v.type === 'table') {
    const fs = v.wells.values; if (!fs.length) return need('Agregá columnas o medidas.');
    const base = baseFilters(v), cols = fs.filter(f => f.kind === 'col'), meas = fs.filter(f => f.kind === 'measure');
    let rowsOut = [];
    const tableOf = cols.length ? cols[0].table : null;
    if (!cols.length) { rowsOut = [fs.map(f => fieldValue(f, mkCtx(base)))]; }
    else {
      // tabla base: la que está del lado "muchos" respecto de las demás
      const tabs = [...new Set(cols.map(c => c.table))];
      let T = tableOf;
      for (const t of tabs) if (tabs.every(o => o === t || M.rels.some(r => r.kind !== 'mm' && r.many.t === t && r.one.t === o))) T = t;
      const idx = E.rowsFor(M, T, mkCtx(base));
      const get = (c, i) => E.relatedValue(M, T, i, c.table, c.name);
      if (!meas.length) {
        rowsOut = idx.slice(0, 200).map(i => fs.map(f => get(f, i)));
      } else {
        const groups = new Map();
        idx.forEach(i => { const key = cols.map(c => E.keyOf(get(c, i))).join('\u0001'); if (!groups.has(key)) groups.set(key, cols.map(c => get(c, i))); });
        const keys = [...groups.values()].sort((a, b) => String(a[0]).localeCompare(String(b[0]), 'es')).slice(0, 200);
        rowsOut = keys.map(vals => {
          const gctx = mkCtx([...base, ...cols.map((c, k) => E.setFilter(M, c.table, c.name, [vals[k]]))]);
          return fs.map(f => (f.kind === 'col' ? vals[cols.findIndex(c => sameField(c, f))] : fieldValue(f, gctx)));
        });
      }
    }
    const head = fs.map(f => `<th class="${f.kind === 'measure' ? 'n' : ''}">${esc(f.name)}</th>`).join('');
    const body = rowsOut.map(r => `<tr>${r.map((x, k) => { const f = fs[k]; const ty = f.kind === 'col' ? E.colInfo(M, f.table, f.name).col.type : ''; return `<td class="${typeof x === 'number' ? 'n' : ''}">${esc(fmtVal(x, f.kind === 'measure' ? measureFmt(f.name) : '', ty))}</td>`; }).join('')}</tr>`).join('');
    return `<table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  }
  // bar | col | line
  const ax = v.wells.axis[0];
  if (!v.wells.values.length || !ax) return need('Agregá una categoría (eje) y uno o más valores.');
  const base = baseFilters(v), d = axisCats(v, base);
  lastCats[v.id] = d.cats;
  if (!d.cats.length) return need('No hay datos para mostrar con los filtros actuales.');
  const fmts = v.wells.values.map(fieldFmt);
  const fmtv = (x, k) => (x === null ? '' : fmtVal(x, fmts[k]));
  if (v.type === 'bar') {
    const mx = Math.max(...d.series.flat().filter(x => x !== null), 0) || 1;
    const rows = d.cats.map((c, i) => `<div class="brow ${crossOn(v, c) ? 'on' : ''}" data-act="cross" data-vid="${v.id}" data-i="${i}"><span class="blab" title="${esc(fmtVal(c, '', d.type))}">${esc(fmtVal(c, '', d.type))}</span><span class="btrack">${d.series.map((s, k) => `<i class="s${k % 4}" style="width:${Math.max(0, (s[i] || 0) / mx * 100)}%"></i>`).join('')}</span><span class="bval">${d.series.map((s, k) => esc(fmtv(s[i], k))).join(' · ')}</span></div>`).join('');
    return legend(v) + rows;
  }
  const W = 420, H = 230, ml = 44, mb = 44, mt = 10, mr = 10, pw = W - ml - mr, ph = H - mt - mb;
  const mx = niceMax(Math.max(...d.series.flat().filter(x => x !== null), 0));
  const y = x => mt + ph - (x / mx) * ph;
  let g = '';
  for (let k = 0; k <= 4; k++) { const val = mx * k / 4, yy = y(val); g += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/><text x="${ml - 5}" y="${yy + 3}" text-anchor="end">${esc(fmtVal(val, fmts[0] === 'pct' ? 'pct' : ''))}</text>`; }
  const n = d.cats.length, step = pw / n, every = Math.ceil(n / 8);
  let marks = '', labels = '';
  d.cats.forEach((c, i) => {
    const cx = ml + step * i + step / 2;
    if (i % every === 0) { const t = fmtVal(c, '', d.type); const tt = t.length > 11 ? t.slice(0, 10) + '…' : t; labels += `<text transform="translate(${cx},${H - mb + 12}) rotate(${n > 5 ? -35 : 0})" text-anchor="${n > 5 ? 'end' : 'middle'}">${esc(tt)}</text>`; }
  });
  if (v.type === 'col') {
    const sw = Math.min(30, step * 0.8 / d.series.length);
    d.cats.forEach((c, i) => {
      const cx = ml + step * i + step / 2, on = crossOn(v, c), dim = S.cross && S.cross.vid === v.id && !on;
      marks += `<g class="hit ${dim ? 'dim' : ''}" data-act="cross" data-vid="${v.id}" data-i="${i}"><rect x="${ml + step * i}" y="${mt}" width="${step}" height="${ph}" fill="transparent"/>` +
        d.series.map((s, k) => { const h = ((s[i] || 0) / mx) * ph; return `<rect class="s${k % 4}" style="fill:var(--c${(k % 4) + 1})" x="${cx - (sw * d.series.length) / 2 + sw * k}" y="${mt + ph - h}" width="${sw - 1}" height="${Math.max(0, h)}"><title>${esc(fmtVal(c, '', d.type))}: ${esc(fmtv(s[i], k))}</title></rect>`; }).join('') + '</g>';
    });
  } else {
    d.series.forEach((s, k) => {
      const pts = s.map((x, i) => (x === null ? null : [ml + step * i + step / 2, y(x)])).filter(Boolean);
      marks += `<path d="M${pts.map(p => p.join(',')).join('L')}" fill="none" stroke="var(--c${(k % 4) + 1})" stroke-width="2"/>`;
    });
    d.cats.forEach((c, i) => { const cx = ml + step * i + step / 2; marks += `<g class="hit" data-act="cross" data-vid="${v.id}" data-i="${i}"><rect x="${ml + step * i}" y="${mt}" width="${step}" height="${ph}" fill="transparent"/><title>${esc(fmtVal(c, '', d.type))}: ${esc(d.series.map((s, k) => fmtv(s[i], k)).join(' · '))}</title>${crossOn(v, c) ? `<circle cx="${cx}" cy="${y(d.series[0][i] || 0)}" r="4" style="fill:var(--c1)"/>` : ''}</g>`; });
  }
  return legend(v) + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(visualTitle(v))}">${g}${marks}${labels}</svg>`;
}

function drawLines() {

  let out = '';
  M.rels.forEach(r => {

    const ra = a.getBoundingClientRect(), rbb = b.getBoundingClientRect();
    const aLeft = ra.left < rbb.left;
    const x1 = (aLeft ? ra.right : ra.left) - wr.left, y1 = ra.top + ra.height / 2 - wr.top;
    const x2 = (aLeft ? rbb.left : rbb.right) - wr.left, y2 = rbb.top + rbb.height / 2 - wr.top;

    out += `<path d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"/>`;

/* ---------- Formula bar ---------- */
function openFbar(mode, table, edit) {
  if (!modelNames().length) return;
  const me = edit ? S.measures.find(m => m.name === edit) : null;
  fbar = { mode, table: me ? me.table : (table || S.dataTable || modelNames()[0]), edit: edit || null };
  const ta = $('#fx'); ta.value = me ? `${me.name} = ${me.expr}` : '';
  ta.placeholder = mode === 'measure' ? 'Total Integrantes = COUNTROWS(integrantes)' : "Rango Etario = IF(integrantes[Edad] < 30, \"Joven\", \"Adulto\")";
  $('#fmsg').textContent = ''; $('#fmsg').className = 'fmsg';
  render(); ta.focus(); fbPreview();
}
function splitFormula(text) {
  const i = text.indexOf('=');
  if (i < 1) throw new E.DaxError('Escribí la fórmula con este formato: Nombre = expresión.');
  const name = text.slice(0, i).trim().replace(/^\[|\]$/g, '').replace(/^'|'$/g, '');
  const expr = text.slice(i + 1).trim();
  if (!name) throw new E.DaxError('Falta el nombre antes del signo =.');
  if (/[()\[\]]/.test(name)) throw new E.DaxError('El nombre no puede incluir paréntesis ni corchetes.');
  if (!expr) throw new E.DaxError('Escribí una expresión después del signo =.');
  return { name, expr };
}
function fbPreview() {
  if (!fbar) return;
  const out = $('#fmsg'), txt = $('#fx').value;
  if (!txt.trim()) { out.textContent = ''; return; }
  try {
    const { name, expr } = splitFormula(txt);
    const ast = E.parse(expr);
    if (fbar.mode === 'measure') { const v = E.evalExpr(M, ast); out.className = 'fmsg fok'; out.textContent = `Vista previa de [${name}]: ${fmtVal(v, $('#fbFmt') ? $('#fbFmt').value : '')}`; }
    else {
      const t = M.tables[$('#fbTable') ? $('#fbTable').value : fbar.table]; const tn = $('#fbTable') ? $('#fbTable').value : fbar.table;
      const vals = []; for (let i = 0; i < Math.min(3, t.rows.length); i++) vals.push(fmtVal(E.evalExpr(M, ast, { filters: [], rows: [{ table: tn, idx: i }], depth: 0 })));
      out.className = 'fmsg fok'; out.textContent = `Primeras filas de ${name}: ${vals.join(' | ')}`;
    }
  } catch (e) { out.className = 'fmsg ferr'; out.textContent = e.message; }
}
function fbCommit() {
  if (!fbar) return;
  const out = $('#fmsg');
  try {
    const { name, expr } = splitFormula($('#fx').value);
    const table = $('#fbTable') ? $('#fbTable').value : fbar.table;
    if (fbar.mode === 'measure') {
      const exists = S.measures.find(m => lc(m.name) === lc(name) && m.name !== fbar.edit);
      if (exists) throw new E.DaxError(`Ya existe una medida llamada ${name}.`);
      if (M.tables[name] || Object.values(M.tables).some(t => t.cols.some(c => lc(c.name) === lc(name)))) throw new E.DaxError(`El nombre ${name} ya lo usa una tabla o una columna. Elegí otro nombre.`);
      const fmt = $('#fbFmt') ? $('#fbFmt').value : '';
      const prev = S.measures.slice();
      const rec = { name, table, expr, fmt };
      S.measures = fbar.edit ? S.measures.map(m => (m.name === fbar.edit ? rec : m)) : [...S.measures, rec];
      try { rebuild(); E.evalMeasure(M, name); } catch (e) { S.measures = prev; rebuild(); throw e; }
      fixVisualFields(fbar.edit, name);
    } else {
      const ast = E.parse(expr), tbl = M.tables[table];
      if (tbl.cols.some(c => lc(c.name) === lc(name))) throw new E.DaxError(`Ya existe una columna llamada '${name}' en '${table}'.`);
      for (let i = 0; i < tbl.rows.length; i++) E.evalExpr(M, ast, { filters: [], rows: [{ table, idx: i }], depth: 0 });
      S.calcCols.push({ table, name, expr }); rebuild();
    }
    const wasMeasure = fbar.mode === 'measure'; fbar = null; toast(wasMeasure ? `Medida ${name} guardada.` : `Columna ${name} creada.`); render();
  } catch (e) { out.className = 'fmsg ferr'; out.textContent = e instanceof E.DaxError ? e.message : 'Error inesperado: ' + e.message; }
}
function fixVisualFields(oldName, newName) {
  if (!oldName || oldName === newName) return;
  S.visuals.forEach(v => Object.values(v.wells).forEach(a => a.forEach(f => { if (f.kind === 'measure' && f.name === oldName) f.name = newName; })));
}

      { text: '4 · Informe: visual KPI con indicador y objetivo, tendencia por Trimestre o Materia.', hint: 'Indicador: Promedio General. Objetivo: una medida con valor 7. Eje de tendencia: Trimestre (campo no numérico).', check: () => anyVis(v => v.type === 'kpi' && v.wells.values.length && v.wells.target.length) },
      { text: '5 · Visualizaciones: al menos 3 tipos distintos entre barras, columnas, líneas y tabla.', hint: 'Barras: Promedio por Materia. Líneas: Promedio por Trimestre. Tabla: Nombre, Curso y promedio.', check: () => new Set(S.visuals.filter(v => ['bar', 'col', 'line', 'table'].includes(v.type) && v.wells[v.type === 'table' ? 'values' : 'axis'].length).map(v => (v.type === 'col' ? 'bar' : v.type))).size >= 3 },
      { text: '5 · Visualización con datos de dos tablas: promedio por Curso (Curso viene de Alumnos).', hint: 'Si todas las barras valen lo mismo, falta o está mal la relación.', check: () => anyVis(v => ['bar', 'col', 'line'].includes(v.type) && v.wells.axis[0] && v.wells.axis[0].table === 'Alumnos' && v.wells.values.length) },
      { text: '6 · Interactividad: segmentadores por Edad y por Materia.', hint: 'Dos visuales Segmentador: uno con Alumnos[Edad] y otro con Notas[Materia].', check: () => S.visuals.some(v => v.type === 'slicer' && v.wells.axis[0] && v.wells.axis[0].name === 'Edad') && S.visuals.some(v => v.type === 'slicer' && v.wells.axis[0] && v.wells.axis[0].name === 'Materia') },
      { text: '6 · Probá la interacción: clic en una barra y mirá cómo filtra las demás.', hint: 'Clic de nuevo en la misma barra para quitar el filtro.', check: () => S.didCross }
    ]
  },
  libre: { title: 'Práctica libre', intro: 'Sin pasos guiados. Cargá cualquier hoja y probá fórmulas, relaciones y visuales.', tasks: [] }
};

/* ---------- Acciones ---------- */
function openGetModal() {
  const ex = S.exercise === 'ex3' ? 'PowerBI_RendimientoAcademico.xlsx' : S.exercise === 'ex2' ? 'Datos de servicio.xlsx' : 'bd_integrantes_Esp.xlsx';
  const body = Object.keys(RAW.datasets).map(ds => `<div class="src"><b>${esc(ds)}</b>${Object.keys(RAW.datasets[ds].sheets).map(sh => { const L = S.loaded.some(x => x.name === sh); return `<label><input type="checkbox" name="sheet" value="${esc(ds)}|${esc(sh)}" ${L ? 'disabled' : ds === ex ? 'checked' : ''}> ${esc(sh)} ${L ? '<span class="hint">(ya cargada)</span>' : ''}</label>`; }).join('')}</div>`).join('');
  modal = { title: 'Navegador: elegí las hojas', body: `<div class="hint">Elegí las hojas que querés usar. “Cargar” las pasa directo al modelo; “Transformar datos” abre el editor de Power Query primero.</div>${body}`, buttons: [{ label: 'Cancelar', act: 'modalClose' }, { label: 'Transformar datos', act: 'getTransform' }, { label: 'Cargar', act: 'getLoad', primary: true }] };
  render();
}
function doGet(transform) {
  const picks = [...document.querySelectorAll('input[name=sheet]:checked')].map(i => i.value.split('|'));
  if (!picks.length) { toast('Tildá al menos una hoja.'); return; }
  picks.forEach(([ds, sh]) => { if (S.loaded.some(x => x.name === sh)) return; S.loaded.push({ name: sh, dataset: ds, sheet: sh }); S.steps[sh] = []; if (!transform) S.applied[sh] = []; });
  modal = null;
  if (transform) { S.view = 'query'; S.qSel = picks[0][1]; S.qCol = null; }
  rebuild(); render();
}
function stepAdd(op, extra) {
  const t = S.qSel; if (!t) return;
  const st = Object.assign({ op, col: S.qCol }, extra || {});
  (S.steps[t] = S.steps[t] || []).push(st);
  if (op === 'rename') S.qCol = extra.to;
  else if (op === 'removeCol') S.qCol = null;
  else if (op === 'split') S.qCol = S.qCol + '.1';
  render();
}
function modalInput(title, fields, act, hint) {
  modal = { title, body: (hint ? `<div class="hint">${hint}</div>` : '') + fields.map(f => `<label class="f">${esc(f.label)}<input type="text" id="${f.id}" value="${esc(f.value || '')}" autocomplete="off"></label>`).join(''), buttons: [{ label: 'Cancelar', act: 'modalClose' }, { label: 'Aceptar', act, primary: true }] };
  render();
}
function addRel(a, b) {
  if (a.t === b.t) { S.relPick = b; render(); return; }
  const dupe = S.rels.some(r => (r.a.t === a.t && r.a.c === a.c && r.b.t === b.t && r.b.c === b.c) || (r.a.t === b.t && r.a.c === b.c && r.b.t === a.t && r.b.c === a.c));
  S.relPick = null;
  if (dupe) { toast('Esa relación ya existe.'); render(); return; }
  const n = E.normalizeRel(M, { a, b });
  if (n && n.typeMismatch) { toast('Los tipos de datos de las dos columnas no coinciden. Cambiá el tipo en Transformar datos.'); render(); return; }
  S.rels.push({ a, b }); rebuild();
  const r = M.rels[M.rels.length - 1];
  toast(r.kind === 'mm' ? 'Relación creada como muchos a muchos: ninguna de las dos columnas tiene valores únicos. Revisá si es la columna correcta.' : r.kind === '11' ? 'Relación uno a uno creada.' : `Relación creada: ${r.one.t} (1) → ${r.many.t} (*).`);
  render();
}
const A = {
  view: d => { S.view = d.v; S.relPick = null; render(); },
  openGet: () => openGetModal(),
  getLoad: () => doGet(false), getTransform: () => doGet(true),
  modalClose: () => { modal = null; render(); },
  openQuery: () => { if (!S.loaded.length) { openGetModal(); return; } S.view = 'query'; S.qCol = null; render(); },
  qSel: d => { S.qSel = d.t; S.qCol = null; render(); },
  qCol: d => { S.qCol = d.c; render(); },
  qOp: d => stepAdd(d.op),
  qOpCol: d => stepAdd(d.op),
  qSplit: () => modalInput('Dividir columna por delimitador', [{ id: 'm1', label: 'Delimitador', value: '-' }], 'splitOk', 'Se divide en el primer delimitador que aparece en cada fila.'),
  splitOk: () => { const v = $('#m1').value; if (!v) return; modal = null; stepAdd('split', { delim: v }); },
  qReplace: () => modalInput('Reemplazar valores', [{ id: 'm1', label: 'Valor buscado' }, { id: 'm2', label: 'Reemplazar con' }], 'replaceOk'),
  replaceOk: () => { const f = $('#m1').value; if (!f) return; const r = $('#m2').value; modal = null; stepAdd('replace', { find: f, rep: r }); },
  qRename: () => modalInput('Cambiar nombre de la columna', [{ id: 'm1', label: 'Nuevo nombre', value: S.qCol }], 'renameOk'),
  renameOk: () => { const to = $('#m1').value.trim(); if (!to) return; modal = null; stepAdd('rename', { to }); },
  stepDel: d => { S.steps[S.qSel].splice(+d.i, 1); render(); },
  applyClose: () => {
    S.loaded.forEach(L => { S.applied[L.name] = JSON.parse(JSON.stringify(S.steps[L.name] || [])); });
    const notes = rebuild(); S.view = 'report'; render();
    toast(notes.length ? notes.join(' ') : 'Cambios aplicados al modelo.');
  },
  newMeasure: () => openFbar('measure'), newCol: () => openFbar('col'),
  editMeasure: d => openFbar('measure', null, d.n),
  fbOk: () => fbCommit(), fbCancel: () => { fbar = null; render(); },
  msDel: d => { S.measures = S.measures.filter(m => m.name !== d.n); S.visuals.forEach(v => Object.keys(v.wells).forEach(k => { v.wells[k] = v.wells[k].filter(f => !(f.kind === 'measure' && f.name === d.n)); })); rebuild(); render(); },
  ccDel: d => { S.calcCols = S.calcCols.filter(c => !(c.table === d.t && c.name === d.n)); S.visuals.forEach(v => Object.keys(v.wells).forEach(k => { v.wells[k] = v.wells[k].filter(f => !(f.kind === 'col' && f.table === d.t && f.name === d.n)); })); rebuild(); render(); },
  toggleTable: d => { S.collapsed[d.t] = !S.collapsed[d.t]; render(); },
  addVisual: d => { newVisual(d.type); render(); },
  selVisual: d => { if (S.sel !== d.id) { S.sel = d.id; render(); } },
  delVisual: d => { S.visuals = S.visuals.filter(v => v.id !== d.id); if (S.sel === d.id) S.sel = null; if (S.cross && S.cross.vid === d.id) S.cross = null; render(); },
  moveVisual: d => { const i = S.visuals.findIndex(v => v.id === d.id), j = i + +d.dir; if (j < 0 || j >= S.visuals.length) return; const [x] = S.visuals.splice(i, 1); S.visuals.splice(j, 0, x); render(); },
  wellRemove: d => { const v = S.visuals.find(x => x.id === d.vid); v.wells[d.well].splice(+d.i, 1); render(); },
  cross: d => {
    const v = S.visuals.find(x => x.id === d.vid), ax = v.wells.axis[0], val = lastCats[v.id][+d.i];
    S.sel = v.id;
    if (S.cross && S.cross.vid === v.id && E.keyOf(S.cross.val) === E.keyOf(val)) S.cross = null;
    else { S.cross = { vid: v.id, table: ax.table, col: ax.name, val }; S.didCross = true; }
    render();
  },
  filterDel: d => { (d.scope === 'page' ? S.pageFilters : S.visuals.find(v => v.id === d.vid).filters).splice(+d.i, 1); render(); },
  relPick: d => {
    const p = { t: d.t, c: d.c };
    if (!S.relPick) { S.relPick = p; render(); return; }
    if (S.relPick.t === p.t && S.relPick.c === p.c) { S.relPick = null; render(); return; }
    addRel(S.relPick, p);
  },
  relDel: d => { S.rels = S.rels.filter(r => (r.a.t + '.' + r.a.c + '~' + r.b.t + '.' + r.b.c) !== d.id); rebuild(); render(); },
  drawer: () => { S.drawer = !S.drawer; render(); },
  help: () => { S.help = !S.help; S.drawer = true; render(); },
  hint: d => { S.hints[d.k] = true; render(); },
  reset: () => { modal = { title: 'Reiniciar el simulador', body: '<div>Se borran los datos cargados, pasos, medidas, relaciones e informe. Los ejercicios vuelven a empezar.</div>', buttons: [{ label: 'Cancelar', act: 'modalClose' }, { label: 'Reiniciar', act: 'resetOk', primary: true }] }; render(); },
  resetOk: () => { const ex = S.exercise; S = defaults(); S.exercise = ex; modal = null; fbar = null; rebuild(); render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'selVisual' && e.target.closest('input,select,label')) return;
  if (A[act]) A[act](Object.assign({}, el.dataset));
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const k = el.dataset.chg;
  if (k === 'exercise') { S.exercise = el.value; render(); }
  else if (k === 'dataTable') { S.dataTable = el.value; render(); }
  else if (k === 'qtype') { if (el.value) stepAdd('type', { type: el.value }); }
  else if (k === 'fbTable') { fbar.table = el.value; fbPreview(); }
  else if (k === 'field') { toggleField(JSON.parse(el.dataset.field), el.checked); render(); }
  else if (k === 'agg') { const v = S.visuals.find(x => x.id === el.dataset.vid); v.wells[el.dataset.well][+el.dataset.i].agg = el.value; render(); }
  else if (k === 'slicer') {
    const v = S.visuals.find(x => x.id === el.dataset.vid), val = lastCats[v.id][+el.dataset.i];
    v.sel = el.checked ? [...v.sel, val] : v.sel.filter(s => E.keyOf(s) !== E.keyOf(val)); S.sel = v.id; render();
  } else if (k === 'filterAdd') {
    if (!el.value) return; const [t, c] = el.value.split('|');
    (el.dataset.scope === 'page' ? S.pageFilters : S.visuals.find(v => v.id === el.dataset.vid).filters).push({ table: t, col: c, sel: [] }); render();
  } else if (k === 'filter') {
    const list = el.dataset.scope === 'page' ? S.pageFilters : S.visuals.find(v => v.id === el.dataset.vid).filters, pf = list[+el.dataset.i];
    const vals = E.distinct(M, pf.table, pf.col, mkCtx([])), val = vals[+el.dataset.k];
    pf.sel = el.checked ? [...pf.sel, val] : pf.sel.filter(s => E.keyOf(s) !== E.keyOf(val));
    const open = el.closest('details'); const idx = open ? [...document.querySelectorAll('#panes details')].indexOf(open) : -1;
    render(); if (idx >= 0) { const d = document.querySelectorAll('#panes details')[idx]; if (d) d.open = true; }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'fx') fbPreview(); });
document.addEventListener('change', e => { if (e.target.id === 'fbFmt') fbPreview(); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'fx' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fbCommit(); }
  if (e.key === 'Escape') { if (modal) A.modalClose(); else if (fbar) A.fbCancel(); }
  if (modal && e.key === 'Enter' && e.target.type === 'text') { const ok = modal.buttons.find(b => b.primary); if (ok && A[ok.act]) A[ok.act](); }
});
/* Arrastrar y soltar */
document.addEventListener('dragstart', e => {
  const f = e.target.closest('[data-field]'), c = e.target.closest('.mc');
  if (f) { e.dataTransfer.setData('text/plain', 'field:' + f.dataset.field); e.dataTransfer.effectAllowed = 'copy'; }
  else if (c) { e.dataTransfer.setData('text/plain', 'rel:' + JSON.stringify({ t: c.dataset.t, c: c.dataset.c })); e.dataTransfer.effectAllowed = 'link'; }
});
document.addEventListener('dragover', e => { const w = e.target.closest('[data-drop],.mc'); if (w) { e.preventDefault(); w.classList.add('over'); } });
document.addEventListener('dragleave', e => { const w = e.target.closest('[data-drop],.mc'); if (w) w.classList.remove('over'); });
document.addEventListener('drop', e => {
  const w = e.target.closest('[data-drop],.mc'); if (!w) return;
  e.preventDefault(); w.classList.remove('over');
  const data = e.dataTransfer.getData('text/plain');
  if (data.startsWith('field:') && w.dataset.drop) { const v = S.visuals.find(x => x.id === w.dataset.vid); addField(v, w.dataset.well, JSON.parse(data.slice(6))); render(); }
  else if (data.startsWith('rel:') && w.classList.contains('mc')) { addRel(JSON.parse(data.slice(4)), { t: w.dataset.t, c: w.dataset.c }); }
});
window.addEventListener('resize', () => { if (S.view === 'model') drawLines(); });
$('#exBtn').addEventListener('click', () => A.drawer());
$('#fbOk').addEventListener('click', () => fbCommit());
$('#fbCancel').addEventListener('click', () => A.fbCancel());

window.PBI = { get S() { return S; }, set S(v) { S = v; }, get M() { return M; }, rebuild, render, EXS, addField, newVisual, toggleField, buildTable };
rebuild(); render();
})();

</script>
